baseURL = 'https://humayl-aslam.github.io/'
languageCode = 'en-us'
title = 'Humayl | Portfolio & Writings'
theme = 'PaperMod'

[params]
  env = 'production'
  title = 'Humayl'
  description = "Essays, thoughts, and technical notes on math & physics."
  author = "Humayl"

  # Enable Math/LaTeX equations globally
  math = true

  # Show reading time on essays
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true

  # Home Page Profile Setup
  [params.profileMode]
    enabled = true
    title = "Humayl 👋"
    subtitle = "Writing on math, physics, reflections, and ideas."

    [[params.profileMode.buttons]]
      name = "Essays & Notes"
      url = "/posts"

    [[params.profileMode.buttons]]
      name = "About"
      url = "/about"

  # Social Icons
  [[params.socialIcons]]
    name = "github"
    url = "https://humayl-aslam.github.io/"
